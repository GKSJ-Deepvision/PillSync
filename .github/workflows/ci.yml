name: CI

# Runs on every push to every branch.
on:
  push:
    branches:
      - "**"
  workflow_dispatch:

# Cancel an older CI run when a newer push happens on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:

  # ---------------------------------------------------------------------------
  # Identify what exists on this branch
  # ---------------------------------------------------------------------------
  identify:
    name: Branch policy
    runs-on: ubuntu-latest

    outputs:
      has_backend: ${{ steps.detect.outputs.has_backend }}
      has_frontend: ${{ steps.detect.outputs.has_frontend }}
      has_ml: ${{ steps.detect.outputs.has_ml }}
      has_backend_docker: ${{ steps.detect.outputs.has_backend_docker }}
      has_frontend_docker: ${{ steps.detect.outputs.has_frontend_docker }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Verify the branch belongs to a roster intern
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: python .github/scripts/check_branch_policy.py

      - name: Detect what has been built so far
        id: detect
        shell: bash
        run: |
          set -uo pipefail

          has_backend=false
          if find backend -name '*.py' -not -path '*/node_modules/*' | grep -q .; then
            has_backend=true
          fi

          has_frontend=false
          if [ -f frontend/package.json ]; then
            has_frontend=true
          fi

          has_ml=false
          if find ml -name '*.py' | grep -q .; then
            has_ml=true
          fi

          has_backend_docker=false
          if [ -f backend/Dockerfile ] && { [ -f backend/manage.py ] || [ -f backend/config/main.py ]; }; then
            has_backend_docker=true
          fi

          has_frontend_docker=false
          if [ -f frontend/Dockerfile ] && [ -f frontend/package.json ]; then
            has_frontend_docker=true
          fi

          {
            echo "has_backend=$has_backend"
            echo "has_frontend=$has_frontend"
            echo "has_ml=$has_ml"
            echo "has_backend_docker=$has_backend_docker"
            echo "has_frontend_docker=$has_frontend_docker"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### What CI found on this branch"
            echo ""
            echo "| Area | Present |"
            echo "|---|---|"
            echo "| Backend Python code | $has_backend |"
            echo "| Frontend package.json | $has_frontend |"
            echo "| ML / OCR code | $has_ml |"
            echo "| Backend image buildable | $has_backend_docker |"
            echo "| Frontend image buildable | $has_frontend_docker |"
          } >> "$GITHUB_STEP_SUMMARY"


  # ---------------------------------------------------------------------------
  # Repository checks
  # ---------------------------------------------------------------------------
  repo-checks:
    name: Repository checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install checker dependencies
        run: pip install --quiet pyyaml

      - name: File hygiene
        run: python .github/scripts/check_files.py

      - name: Secret scan
        if: always()
        run: python .github/scripts/scan_secrets.py

      - name: Structure and progress
        if: always()
        run: python .github/scripts/check_structure.py

      - name: Validate YAML and JSON syntax
        if: always()
        run: python .github/scripts/check_config_syntax.py


  # ---------------------------------------------------------------------------
  # Backend
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (lint + tests)

    needs: identify

    if: needs.identify.outputs.has_backend == 'true'

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine

        env:
          POSTGRES_DB: pillsync_test
          POSTGRES_USER: pillsync
          POSTGRES_PASSWORD: pillsync

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U pillsync"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev

      PYTHONPATH: .

      SECRET_KEY: ci-only-not-a-real-secret

      DEBUG: "False"

      POSTGRES_DB: pillsync_test
      POSTGRES_USER: pillsync
      POSTGRES_PASSWORD: pillsync
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements/*.txt


      # ---------------------------------------------------------------------
      # Database
      # ---------------------------------------------------------------------
      - name: Point the test database at the service container
        run: |
          echo "DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@localhost:5432/${POSTGRES_DB}" >> "$GITHUB_ENV"


      # ---------------------------------------------------------------------
      # Tesseract
      # ---------------------------------------------------------------------
      - name: Install Tesseract (only if the branch uses OCR)
        shell: bash
        run: |
          if grep -rqiE '^[[:space:]]*pytesseract' requirements/ 2>/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq tesseract-ocr libtesseract-dev
          else
            echo "pytesseract not in requirements yet - skipping Tesseract install."
          fi


      # ---------------------------------------------------------------------
      # Python dependencies
      # ---------------------------------------------------------------------
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements/base.txt ]; then
            pip install -r requirements/base.txt
          fi

          if [ -f requirements/dev.txt ]; then
            pip install -r requirements/dev.txt
          fi

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          # CI tools
          pip install ruff black isort pytest pytest-cov

          # Authentication and PostgreSQL dependencies
          pip install "pwdlib[argon2]" "psycopg[binary]"


      # ---------------------------------------------------------------------
      # Verify dependencies
      # ---------------------------------------------------------------------
      - name: Verify backend dependencies
        run: |
          python -c "import pwdlib; print('pwdlib OK')"
          python -c "import psycopg; print('psycopg OK')"


      # ---------------------------------------------------------------------
      # Ruff
      # ---------------------------------------------------------------------
      - name: Ruff (lint)
        run: ruff check . --output-format=github


      # ---------------------------------------------------------------------
      # Black
      # ---------------------------------------------------------------------
      - name: Black (formatting)
        run: black --check --diff .


      # ---------------------------------------------------------------------
      # isort
      # ---------------------------------------------------------------------
      - name: isort (import order)
        run: isort --check-only --diff .


      # ---------------------------------------------------------------------
      # Django checks
      # ---------------------------------------------------------------------
      - name: Django system checks
        shell: bash
        run: |
          if [ -f manage.py ]; then
            python manage.py check
          else
            echo "No manage.py yet - skipping Django checks."
          fi


      # ---------------------------------------------------------------------
      # Pytest
      # ---------------------------------------------------------------------
      - name: Pytest
        shell: bash
        run: |
          set +e

          pytest \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml \
            --junitxml=pytest-report.xml

          code=$?

          set -e

          if [ "$code" -eq 5 ]; then
            echo "::warning::No tests were collected. Add tests under backend/tests/ or backend/apps/<app>/tests/."
            echo "> Backend: no tests collected yet." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          exit $code


      # ---------------------------------------------------------------------
      # Coverage
      # ---------------------------------------------------------------------
      - name: Coverage summary
        if: always()
        shell: bash
        run: |
          if [ -f coverage.xml ]; then
            python "$GITHUB_WORKSPACE/.github/scripts/coverage_summary.py" coverage.xml
          fi


      # ---------------------------------------------------------------------
      # Test artifacts
      # ---------------------------------------------------------------------
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4

        with:
          name: backend-test-results-${{ github.run_id }}

          path: |
            backend/pytest-report.xml
            backend/coverage.xml

          retention-days: 14

          if-no-files-found: ignore


  # ---------------------------------------------------------------------------
  # Frontend
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (lint + tests + build)

    needs: identify

    if: needs.identify.outputs.has_frontend == 'true'

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    env:
      CI: "true"
      VITE_API_BASE_URL: http://localhost:8000/api

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "::warning file=frontend/package.json::No package-lock.json committed."
            npm install
          fi

      - name: Lint
        run: npm run lint --if-present

      - name: Format check
        run: npm run format:check --if-present

      - name: Tests
        shell: bash
        run: |
          if find src tests -type f \( -name '*.test.*' -o -name '*.spec.*' \) 2>/dev/null | grep -q .; then
            npm test --if-present
          else
            echo "::warning::No frontend test files found yet."
            echo "> Frontend: no test files yet." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build
        run: npm run build --if-present

      - name: Report which scripts are defined
        if: always()
        shell: bash
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/frontend_scripts_report.py"

      - name: Upload build output
        if: success()
        uses: actions/upload-artifact@v4

        with:
          name: frontend-build-${{ github.run_id }}

          path: |
            frontend/dist
            frontend/build

          retention-days: 7

          if-no-files-found: ignore


  # ---------------------------------------------------------------------------
  # ML / OCR
  # ---------------------------------------------------------------------------
  ml:
    name: ML / OCR checks

    needs: identify

    if: needs.identify.outputs.has_ml == 'true'

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install tooling
        shell: bash
        working-directory: ml
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Ruff
        working-directory: ml
        run: ruff check . --output-format=github

      - name: Check notebooks have no stored outputs
        run: python .github/scripts/check_notebooks.py

      - name: Pytest
        shell: bash
        working-directory: ml
        run: |
          set +e

          pytest

          code=$?

          set -e

          if [ "$code" -eq 5 ]; then
            echo "::warning::No ML tests collected yet."
            exit 0
          fi

          exit $code


  # ---------------------------------------------------------------------------
  # Docker
  # ---------------------------------------------------------------------------
  docker:
    name: Docker build

    needs: identify

    if: >-
      needs.identify.outputs.has_backend_docker == 'true' ||
      needs.identify.outputs.has_frontend_docker == 'true'

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        if: needs.identify.outputs.has_backend_docker == 'true'
        uses: docker/build-push-action@v6

        with:
          context: ./backend
          push: false
          tags: pillsync-backend:ci

      - name: Build frontend image
        if: needs.identify.outputs.has_frontend_docker == 'true'
        uses: docker/build-push-action@v6

        with:
          context: ./frontend
          push: false
          tags: pillsync-frontend:ci


  # ---------------------------------------------------------------------------
  # Final CI status
  # ---------------------------------------------------------------------------
  ci-status:
    name: CI status

    runs-on: ubuntu-latest

    needs:
      - identify
      - repo-checks
      - backend
      - frontend
      - ml
      - docker

    if: always()

    steps:

      - name: Summarise
        shell: bash

        env:
          IDENTIFY: ${{ needs.identify.result }}
          REPO_CHECKS: ${{ needs.repo-checks.result }}
          BACKEND: ${{ needs.backend.result }}
          FRONTEND: ${{ needs.frontend.result }}
          ML_CHECKS: ${{ needs.ml.result }}
          DOCKER: ${{ needs.docker.result }}
          BRANCH: ${{ github.ref_name }}

        run: |
          {
            echo "### CI result for \`$BRANCH\`"
            echo ""
            echo "| Job | Result |"
            echo "|---|---|"
            echo "| Branch policy | $IDENTIFY |"
            echo "| Repository checks | $REPO_CHECKS |"
            echo "| Backend | $BACKEND |"
            echo "| Frontend | $FRONTEND |"
            echo "| ML / OCR | $ML_CHECKS |"
            echo "| Docker | $DOCKER |"
            echo ""
            echo "\`skipped\` means that area has no code on this branch yet - that is expected early on."
          } >> "$GITHUB_STEP_SUMMARY"

          failed=0

          for result in "$IDENTIFY" "$REPO_CHECKS" "$BACKEND" "$FRONTEND" "$ML_CHECKS" "$DOCKER"; do
            case "$result" in
              failure|cancelled)
                failed=1
                ;;
            esac
          done

          if [ "$failed" -eq 1 ]; then
            echo "::error::At least one CI job did not pass. Open the failing job above for the details."
            exit 1
          fi

          echo "All checks that applied to this branch passed."
