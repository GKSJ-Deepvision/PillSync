services:
  - type: web
    name: pillsync-api
    runtime: docker
    plan: free
    region: oregon
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  - type: web
    name: pillsync-web
    runtime: static
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_CLOUDINARY_CLOUD_NAME
        sync: false
      - key: VITE_CLOUDINARY_UPLOAD_PRESET
        sync: false
      - key: VITE_CLOUDINARY_FOLDER
        sync: false
      - key: VITE_APP_NAME
        value: PillSync
