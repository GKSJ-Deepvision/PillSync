# Render Blueprint for a FREE deployment of PillSync. A demo, not for real patients.
#
# What is left out compared with render.yaml, and why:
#   * No Celery worker and no Redis. Render has no free background worker, so an external
#     free cron service calls POST /internal/run-jobs/ to send reminders instead. See
#     docs/deployment.md, "Option 2b".
#   * No database here. Render's free Postgres has expired after 30 days, so use a free
#     Postgres that does not (Neon, Supabase) and paste its connection string as DATABASE_URL.
#   * No disk, so uploaded prescription photos are lost on each deploy. OCR still works.
#
# Free-tier limits are Render's to change; confirm them on its pricing page. This file has
# not been applied to a Render account.

services:
  - type: web
    name: pillsync-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health/ready/
    autoDeploy: true
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: RUN_MIGRATIONS
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false              # you are asked for it when the blueprint is applied
      - key: CRON_SECRET
        generateValue: true      # copy it from this service's Environment tab into the cron jobs
      - key: ALLOWED_HOSTS
        value: pillsync-api.onrender.com   # change if you rename the service
      - key: CORS_ALLOWED_ORIGINS
        value: https://pillsync-web.onrender.com
      - key: WEB_CONCURRENCY
        value: "1"               # free instances have about 512 MB of memory; Tesseract needs room
      - key: DEFAULT_FROM_EMAIL
        value: noreply@pillsync.example.com

  # The web app: a static site, free on Render. /api and /admin are forwarded to the API so the
  # browser sees a single origin.
  - type: web
    name: pillsync-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://pillsync-api.onrender.com/api/*
      - type: rewrite
        source: /admin/*
        destination: https://pillsync-api.onrender.com/admin/*
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
