<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>PillSync - History</title>
    <link rel="stylesheet" href="dashboard.css" />
    <link rel="stylesheet" href="history.css" />
    <link rel="stylesheet" href="debug-logger.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">💊 PillSync</div>
        <div class="profile-card">
          <div class="profile-avatar" id="sidebarAvatar">U</div>
          <div class="profile-name" id="sidebarName">Loading...</div>
          <div class="profile-email" id="sidebarEmail">...</div>
          <span class="role-badge" id="sidebarRole">Patient</span>
        </div>
        <nav class="nav">
          <a href="dashboard.html" class="nav-item">Dashboard</a>
          <a href="my-medicines.html" class="nav-item">My Medicines</a>
          <a href="add-medicine.html" class="nav-item">Add Medicine</a>
          <a href="history.html" class="nav-item active">History</a>
        </nav>
        <a href="login.html" class="logout" onclick="localStorage.removeItem('access_token')">Log out</a>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <div class="greeting">Medication history</div>
            <div class="subgreeting">Your adherence over the past days</div>
          </div>
        </header>

        <!-- SUMMARY STATS -->
        <section class="summary-row" id="summaryRow"></section>

        <!-- HISTORY LOG -->
        <section class="history-section">
          <h2 class="section-title">Daily log</h2>
          <div class="history-list" id="historyList"></div>
        </section>
      </main>
    </div>

    <script src="history.js"></script>
    <script src="debug-logger.js"></script>
  </body>
</html>
