<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>PillSync - My Medicines</title>
    <link rel="stylesheet" href="dashboard.css" />
    <link rel="stylesheet" href="my-medicines.css" />
    <link rel="stylesheet" href="debug-logger.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">💊 PillSync</div>

        <!-- PROFILE CARD -->
        <div class="profile-card">
          <div class="profile-avatar" id="sidebarAvatar">U</div>
          <div class="profile-name" id="sidebarName">Loading...</div>
          <div class="profile-email" id="sidebarEmail">...</div>
          <span class="role-badge" id="sidebarRole">Patient</span>
        </div>

        <!-- CAREGIVER CARD -->
        <div class="caregiver-card">
          <div class="caregiver-label">Your caregiver</div>
          <div class="caregiver-name" id="caregiverName">None linked</div>
          <div class="caregiver-email" id="caregiverEmail">No email</div>
        </div>

        <nav class="nav">
          <a href="dashboard.html" class="nav-item">🏠 Dashboard</a>
          <a href="my-medicines.html" class="nav-item active">💊 My Medicines</a>
          <a href="add-medicine.html" class="nav-item">➕ Add Medicine</a>
          <a href="history.html" class="nav-item">📊 History</a>
        </nav>

        <a href="login.html" class="logout" onclick="localStorage.removeItem('access_token')"
          >Log out</a
        >
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <div class="greeting">My medicines</div>
            <div class="subgreeting">All the medicines you're currently tracking</div>
          </div>
          <button class="add-btn" onclick="window.location.href = 'add-medicine.html'">
            + Add medicine
          </button>
        </header>

        <input type="text" class="search-bar" id="searchBar" placeholder="Search medicines..." />

        <div class="filter-chips" id="filterChips"></div>

        <div class="full-medicine-list" id="fullMedicineList"></div>
      </main>
    </div>

    <script src="user-session.js?v=3"></script>
    <script src="my-medicines.js?v=3"></script>
    <script src="debug-logger.js"></script>
  </body>
</html>
