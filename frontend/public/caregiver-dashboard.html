<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PillSync - Caregiver Dashboard</title>
<link rel="stylesheet" href="dashboard.css">
<link rel="stylesheet" href="caregiver-dashboard.css">
</head>
<body>

  <div class="app">

    <aside class="sidebar">
      <div class="brand">💊 PillSync</div>
            <div class="mini-card" onclick="window.location.href='caregiver-profile.html'">
        <div class="mini-avatar mini-avatar-alt">P</div>
        <div class="mini-text">
          <div class="mini-name">Pari Verma</div>
          <div class="mini-sub">Caregiver · View profile</div>
        </div>
        <span class="mini-chevron">›</span>
      </div>
      <nav class="nav">
        <a href="#" class="nav-item active">My Patients</a>
        <a href="#" class="nav-item">Alerts</a>
      </nav>
      <a href="login.html" class="logout">Log out</a>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <div class="greeting">Good morning, Pari</div>
          <div class="subgreeting">Here's how your patients are doing today</div>
        </div>
      </header>

      <!-- ALERTS -->
      <section class="alerts-section" id="alertsSection"></section>

      <!-- PATIENT LIST -->
      <section class="patients-section">
        <h2 class="section-title">Patients you monitor</h2>
        <div class="patient-grid" id="patientGrid"></div>
      </section>

    </main>
  </div>

  <script src="caregiver-dashboard.js"></script>
</body>
  <!-- CHAT MODAL -->
  <div class="chat-overlay" id="chatModal" style="display:none;">
    <div class="chat-box">
      <div class="chat-header">
        <span id="chatWithName">Chat</span>
        <button class="chat-close" onclick="closeChat()">✕</button>
      </div>
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-input-row">
        <input type="text" id="chatInput" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>
    <script>window.CHAT_ME = "Pari Verma";</script>
  <script src="chat.js"></script>
  <script src="caregiver-dashboard.js"></script>
</html>
