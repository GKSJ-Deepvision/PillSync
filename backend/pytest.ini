; pytest configuration lives here rather than in pyproject.toml because
; pytest-django needs DJANGO_SETTINGS_MODULE before the pyproject [tool.pytest]
; table is read on some setups. Coverage and lint settings stay in pyproject.
[pytest]
DJANGO_SETTINGS_MODULE = config.settings.dev
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
testpaths = tests apps
addopts = -ra --strict-markers
markers =
    unit: fast tests with no external dependencies
    integration: tests that touch the database or the API layer
    slow: long-running tests
