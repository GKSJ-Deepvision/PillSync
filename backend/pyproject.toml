[tool.ruff]
exclude = ["**/migrations/*.py", ".venv"]
line-length = 100

[tool.ruff.lint]
ignore = ["RUF012"]  # Django Meta classes and migrations are standard mutable-looking attrs

[tool.black]
line-length = 100
extend-exclude = "migrations|\\.venv"

[tool.isort]
profile = "black"
line_length = 100
skip_glob = ["*/migrations/*"]
