# Shared tooling configuration for the PillSync backend.
# CI runs ruff, black, isort and pytest against these settings — keep them as-is
# so every intern's branch is checked identically.

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = '/(migrations|\.venv|node_modules)/'

[tool.isort]
profile = "black"
line_length = 100
skip_glob = ["*/migrations/*", "*/.venv/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["migrations", ".venv", "node_modules", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "C4"]
ignore = [
    "E501",  # line length is enforced by black
    "B008",  # function call in default argument (common in FastAPI Depends)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests", "apps"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers"
# This branch uses the FastAPI alternative, so tests are async by default —
# no need to sprinkle @pytest.mark.asyncio on every test function.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: fast tests with no external dependencies",
    "integration: tests that touch the database or the API layer",
    "slow: long-running tests",
]

[tool.coverage.run]
branch = true
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/.venv/*",
    "manage.py",
    "config/asgi.py",
    "config/wsgi.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
