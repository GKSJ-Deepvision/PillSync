openapi: 3.0.3
info:
  title: PillSync API
  version: 0.1.0
  description: Intelligent medicine reminder and medication tracking platform. Milestone
    1 covers authentication, role-based access and patient profiles.
paths:
  /api/v1/admin/users/:
    get:
      operationId: admin_users_list
      description: |-
        Administrator user management.

        Built from explicit mixins rather than ModelViewSet so that POST reaches the
        activate/deactivate actions only - there is no create route here, because a
        user is created through registration, and no destroy route, because
        medication history must outlive the account.
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: is_email_verified
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: role
        schema:
          type: string
          enum:
          - ADMIN
          - CAREGIVER
          - PATIENT
        description: |-
          * `PATIENT` - Patient
          * `CAREGIVER` - Caregiver
          * `ADMIN` - Admin
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - users
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminUserList'
          description: ''
  /api/v1/admin/users/{id}/:
    get:
      operationId: admin_users_retrieve
      description: |-
        Administrator user management.

        Built from explicit mixins rather than ModelViewSet so that POST reaches the
        activate/deactivate actions only - there is no create route here, because a
        user is created through registration, and no destroy route, because
        medication history must outlive the account.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this user.
        required: true
      tags:
      - users
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
    patch:
      operationId: admin_users_partial_update
      description: |-
        Administrator user management.

        Built from explicit mixins rather than ModelViewSet so that POST reaches the
        activate/deactivate actions only - there is no create route here, because a
        user is created through registration, and no destroy route, because
        medication history must outlive the account.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this user.
        required: true
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
  /api/v1/admin/users/{id}/activate/:
    post:
      operationId: admin_users_activate_create
      description: |-
        Administrator user management.

        Built from explicit mixins rather than ModelViewSet so that POST reaches the
        activate/deactivate actions only - there is no create route here, because a
        user is created through registration, and no destroy route, because
        medication history must outlive the account.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this user.
        required: true
      tags:
      - users
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
  /api/v1/admin/users/{id}/deactivate/:
    post:
      operationId: admin_users_deactivate_create
      description: 'Deactivate rather than delete: medication history has to survive.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this user.
        required: true
      tags:
      - users
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
  /api/v1/auth/google/:
    post:
      operationId: auth_google_create
      description: Exchange a verified Google ID token for PillSync tokens.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: Tokens and the signed-in user
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: Email and password login. Returns an access/refresh pair plus the
        user.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PillSyncTokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PillSyncTokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PillSyncTokenObtainPairRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: |-
        Blacklist a refresh token so it cannot be used again.

        The access token stays valid until it expires - that is how stateless JWTs
        work. Keeping the access lifetime short (30 minutes by default) is what
        bounds the window.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '205':
          description: No response body
  /api/v1/auth/password/change/:
    post:
      operationId: auth_password_change_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/auth/password/reset/:
    post:
      operationId: auth_password_reset_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetRequest'
          description: ''
  /api/v1/auth/password/reset/confirm/:
    post:
      operationId: auth_password_reset_confirm_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetConfirm'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: auth_register_create
      description: Create a patient or caregiver account and sign straight in.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
  /api/v1/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/token/verify/:
    post:
      operationId: auth_token_verify_create
      description: |-
        Takes a token and indicates if it is valid.  This view provides no
        information about a token's fitness for a particular use.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/v1/caregiver-assignments/:
    get:
      operationId: caregiver_assignments_list
      description: |-
        Caregiver-to-patient links.

        Patients see and manage the caregivers who can see them; caregivers see the
        patients who have granted them access. An assignment is created PENDING and
        only the patient can activate it.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - caregiving
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCaregiverAssignmentList'
          description: ''
    post:
      operationId: caregiver_assignments_create
      description: |-
        Caregiver-to-patient links.

        Patients see and manage the caregivers who can see them; caregivers see the
        patients who have granted them access. An assignment is created PENDING and
        only the patient can activate it.
      tags:
      - caregiving
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaregiverInviteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CaregiverInviteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CaregiverInviteRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaregiverInvite'
          description: ''
  /api/v1/caregiver-assignments/{id}/:
    get:
      operationId: caregiver_assignments_retrieve
      description: |-
        Caregiver-to-patient links.

        Patients see and manage the caregivers who can see them; caregivers see the
        patients who have granted them access. An assignment is created PENDING and
        only the patient can activate it.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this caregiver assignment.
        required: true
      tags:
      - caregiving
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaregiverAssignment'
          description: ''
    patch:
      operationId: caregiver_assignments_partial_update
      description: |-
        Caregiver-to-patient links.

        Patients see and manage the caregivers who can see them; caregivers see the
        patients who have granted them access. An assignment is created PENDING and
        only the patient can activate it.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this caregiver assignment.
        required: true
      tags:
      - caregiving
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCaregiverAssignmentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCaregiverAssignmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCaregiverAssignmentRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaregiverAssignment'
          description: ''
    delete:
      operationId: caregiver_assignments_destroy
      description: |-
        Caregiver-to-patient links.

        Patients see and manage the caregivers who can see them; caregivers see the
        patients who have granted them access. An assignment is created PENDING and
        only the patient can activate it.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this caregiver assignment.
        required: true
      tags:
      - caregiving
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/caregiver-assignments/{id}/accept/:
    post:
      operationId: caregiver_assignments_accept_create
      description: The patient grants the caregiver access.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this caregiver assignment.
        required: true
      tags:
      - caregiving
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaregiverAssignment'
          description: ''
  /api/v1/caregiver-assignments/{id}/decline/:
    post:
      operationId: caregiver_assignments_decline_create
      description: |-
        Caregiver-to-patient links.

        Patients see and manage the caregivers who can see them; caregivers see the
        patients who have granted them access. An assignment is created PENDING and
        only the patient can activate it.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this caregiver assignment.
        required: true
      tags:
      - caregiving
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaregiverAssignment'
          description: ''
  /api/v1/caregiver-assignments/{id}/revoke/:
    post:
      operationId: caregiver_assignments_revoke_create
      description: Either side can end an active assignment.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this caregiver assignment.
        required: true
      tags:
      - caregiving
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaregiverAssignment'
          description: ''
  /api/v1/doses/:
    get:
      operationId: doses_list
      description: |-
        Scheduled doses: what is due, and what happened to what was due.

        Read-only apart from the four actions. A dose never changes state by having
        its fields written directly — every transition goes through the service
        layer, so stock decrements and caregiver alerts cannot be bypassed.
      parameters:
      - in: query
        name: medicine
        schema:
          type: string
          format: uuid
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: patient
        schema:
          type: string
          format: uuid
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: slot
        schema:
          type: string
          enum:
          - AFTERNOON
          - EVENING
          - MORNING
          - NIGHT
        description: |-
          * `MORNING` - Morning
          * `AFTERNOON` - Afternoon
          * `EVENING` - Evening
          * `NIGHT` - Night
      - in: query
        name: status
        schema:
          type: string
          enum:
          - MISSED
          - PENDING
          - SKIPPED
          - SNOOZED
          - TAKEN
        description: |-
          * `PENDING` - Due
          * `TAKEN` - Taken
          * `MISSED` - Missed
          * `SNOOZED` - Snoozed
          * `SKIPPED` - Skipped on purpose
      tags:
      - reminders
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDoseEventList'
          description: ''
  /api/v1/doses/{id}/:
    get:
      operationId: doses_retrieve
      description: |-
        Scheduled doses: what is due, and what happened to what was due.

        Read-only apart from the four actions. A dose never changes state by having
        its fields written directly — every transition goes through the service
        layer, so stock decrements and caregiver alerts cannot be bypassed.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this dose event.
        required: true
      tags:
      - reminders
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoseEvent'
          description: ''
  /api/v1/doses/{id}/miss/:
    post:
      operationId: doses_miss_create
      description: Record the dose as missed. Caregivers who opted in are alerted.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this dose event.
        required: true
      tags:
      - reminders
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoseEvent'
          description: ''
  /api/v1/doses/{id}/skip/:
    post:
      operationId: doses_skip_create
      description: Deliberately skip a dose — not counted as an adherence failure.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this dose event.
        required: true
      tags:
      - reminders
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoseEvent'
          description: ''
  /api/v1/doses/{id}/snooze/:
    post:
      operationId: doses_snooze_create
      description: Postpone the reminder.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this dose event.
        required: true
      tags:
      - reminders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SnoozeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SnoozeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SnoozeRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoseEvent'
          description: ''
  /api/v1/doses/{id}/take/:
    post:
      operationId: doses_take_create
      description: Record the dose as taken and decrement stock.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this dose event.
        required: true
      tags:
      - reminders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TakeDoseRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TakeDoseRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TakeDoseRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoseEvent'
          description: ''
  /api/v1/doses/history/:
    get:
      operationId: doses_history_retrieve
      description: |-
        Medication history: one row per day, with the doses of each.

        This is the Milestone 2 deliverable that Milestone 3's adherence
        analytics builds on — the daily counts here are exactly what the
        percentage, streak and trend calculations will aggregate.
      parameters:
      - in: query
        name: days
        schema:
          type: integer
        description: Look back N days, max 92.
      - in: query
        name: patient
        schema:
          type: string
        description: Limit to one patient profile.
      tags:
      - reminders
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/doses/today/:
    get:
      operationId: doses_today_retrieve
      description: Today's doses, grouped into morning / afternoon / evening / night.
      parameters:
      - in: query
        name: date
        schema:
          type: string
        description: ISO date. Defaults to today.
      - in: query
        name: patient
        schema:
          type: string
        description: Limit to one patient profile.
      tags:
      - reminders
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/doses/upcoming/:
    get:
      operationId: doses_upcoming_list
      description: Doses still to come.
      parameters:
      - in: query
        name: days
        schema:
          type: integer
        description: How many days ahead. Default 7.
      - in: query
        name: medicine
        schema:
