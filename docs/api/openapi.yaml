components:
  schemas:
    AdminUser:
      type: object
      description: Full user record, for administrators only.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        full_name:
          type: string
          maxLength: 150
        phone_number:
          type: string
          maxLength: 32
        role:
          $ref: '#/components/schemas/UserRoleEnum'
        auth_provider:
          allOf:
          - $ref: '#/components/schemas/AuthProviderEnum'
          readOnly: true
        is_email_verified:
          type: boolean
        is_active:
          type: boolean
          description: 'Deactivate instead of deleting: medication history must survive.'
        is_staff:
          type: boolean
        date_joined:
          type: string
          format: date-time
          readOnly: true
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - auth_provider
      - created_at
      - date_joined
      - email
      - full_name
      - id
      - last_login
    AssignmentStatusEnum:
      enum:
      - PENDING
      - ACTIVE
      - REVOKED
      - DECLINED
      type: string
      description: |-
        * `PENDING` - Pending patient approval
        * `ACTIVE` - Active
        * `REVOKED` - Revoked
        * `DECLINED` - Declined
    AuthProviderEnum:
      enum:
      - LOCAL
      - GOOGLE
      type: string
      description: |-
        * `LOCAL` - Email and password
        * `GOOGLE` - Google
    BlankEnum:
      enum:
      - ''
    BloodGroupEnum:
      enum:
      - A+
      - A-
      - B+
      - B-
      - AB+
      - AB-
      - O+
      - O-
      - UNKNOWN
      type: string
      description: |-
        * `A+` - A+
        * `A-` - A-
        * `B+` - B+
        * `B-` - B-
        * `AB+` - AB+
        * `AB-` - AB-
        * `O+` - O+
        * `O-` - O-
        * `UNKNOWN` - Unknown
    CaregiverAssignment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        caregiver:
          type: string
          format: uuid
        caregiver_name:
          type: string
          readOnly: true
        caregiver_email:
          type: string
          format: email
          readOnly: true
        patient:
          type: string
          format: uuid
        patient_name:
          type: string
          readOnly: true
        patient_email:
          type: string
          format: email
          readOnly: true
        relationship:
          $ref: '#/components/schemas/CaregiverRelationshipEnum'
        status:
          allOf:
          - $ref: '#/components/schemas/AssignmentStatusEnum'
          readOnly: true
        can_view_adherence:
          type: boolean
        can_receive_alerts:
          type: boolean
        can_manage_medications:
          type: boolean
          description: 'Off by default: viewing a medication schedule and changing
            it are very different levels of trust.'
        responded_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        notes:
          type: string
          maxLength: 255
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - caregiver
      - caregiver_email
      - caregiver_name
      - created_at
      - id
      - patient
      - patient_email
      - patient_name
      - responded_at
      - status
    CaregiverInvite:
      type: object
      description: |-
        A patient invites a caregiver by email.

        Addressing the caregiver by email rather than id means the patient does not
        need to look up an internal identifier, and cannot enumerate accounts by
        trying ids.
      properties:
        caregiver_email:
          type: string
          format: email
        relationship:
          allOf:
          - $ref: '#/components/schemas/CaregiverRelationshipEnum'
          default: FAMILY
        can_view_adherence:
          type: boolean
          default: true
        can_receive_alerts:
          type: boolean
          default: true
        can_manage_medications:
          type: boolean
          default: false
        notes:
          type: string
          maxLength: 255
      required:
      - caregiver_email
    CaregiverInviteRequest:
      type: object
      description: |-
        A patient invites a caregiver by email.

        Addressing the caregiver by email rather than id means the patient does not
        need to look up an internal identifier, and cannot enumerate accounts by
        trying ids.
      properties:
        caregiver_email:
          type: string
          format: email
          minLength: 1
        relationship:
          allOf:
          - $ref: '#/components/schemas/CaregiverRelationshipEnum'
          default: FAMILY
        can_view_adherence:
          type: boolean
          default: true
        can_receive_alerts:
          type: boolean
          default: true
        can_manage_medications:
          type: boolean
          default: false
        notes:
          type: string
          maxLength: 255
      required:
      - caregiver_email
    CaregiverProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user:
          type: string
          format: uuid
          readOnly: true
        full_name:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        organisation:
          type: string
          maxLength: 200
        qualification:
          type: string
          maxLength: 200
        license_number:
          type: string
          maxLength: 64
        years_of_experience:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        is_professional:
          type: boolean
          description: A nurse or clinician, as opposed to a family caregiver.
        is_verified:
          type: boolean
          readOnly: true
          description: An administrator has checked the credentials above.
        active_patient_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - active_patient_count
      - created_at
      - email
      - full_name
      - id
      - is_verified
      - user
    CaregiverRelationshipEnum:
      enum:
      - FAMILY
      - SPOUSE
      - PARENT
      - CHILD
      - PROFESSIONAL
      - NURSE
      - DOCTOR
      - OTHER
      type: string
      description: |-
        * `FAMILY` - Family member
        * `SPOUSE` - Spouse
        * `PARENT` - Parent
        * `CHILD` - Child
        * `PROFESSIONAL` - Professional caregiver
        * `NURSE` - Nurse
        * `DOCTOR` - Doctor
        * `OTHER` - Other
    CategorySummary:
      type: object
      properties:
        code:
          type: string
        label:
          type: string
        medicine_count:
          type: integer
      required:
      - code
      - label
      - medicine_count
    ChannelEnum:
      enum:
      - PUSH
      - EMAIL
      - SMS
      type: string
      description: |-
        * `PUSH` - Push notification
        * `EMAIL` - Email
        * `SMS` - SMS
    DeviceToken:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        platform:
          $ref: '#/components/schemas/PlatformEnum'
        device_name:
          type: string
          maxLength: 120
        is_active:
          type: boolean
          readOnly: true
        last_used_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - is_active
      - last_used_at
    DeviceTokenRequest:
      type: object
      properties:
        token:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 512
        platform:
          $ref: '#/components/schemas/PlatformEnum'
        device_name:
          type: string
          maxLength: 120
      required:
      - token
    DoseEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        schedule:
          type: string
          format: uuid
          readOnly: true
        medicine:
          type: string
          format: uuid
          readOnly: true
        medicine_name:
          type: string
          readOnly: true
        medicine_strength:
          type: string
          readOnly: true
        medicine_category:
          type: string
          readOnly: true
        instructions:
          type: string
          readOnly: true
        patient:
          type: string
          format: uuid
          readOnly: true
        patient_name:
          type: string
          readOnly: true
        scheduled_for:
          type: string
          format: date-time
          readOnly: true
        effective_time:
          type: string
          format: date-time
          readOnly: true
        slot:
          allOf:
          - $ref: '#/components/schemas/SlotEnum'
          readOnly: true
        slot_display:
          type: string
          readOnly: true
        quantity_expected:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
          readOnly: true
        quantity_taken:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/DoseEventStatusEnum'
          readOnly: true
        status_display:
          type: string
          readOnly: true
        is_overdue:
          type: boolean
          readOnly: true
        can_snooze:
          type: boolean
          readOnly: true
        snooze_until:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        snooze_count:
          type: integer
          readOnly: true
        responded_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        reminder_sent_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        caregiver_alerted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        notes:
          type: string
          readOnly: true
      required:
      - can_snooze
      - caregiver_alerted_at
      - effective_time
      - id
      - instructions
      - is_overdue
      - medicine
      - medicine_category
      - medicine_name
      - medicine_strength
      - notes
      - patient
      - patient_name
      - quantity_expected
      - quantity_taken
      - reminder_sent_at
      - responded_at
      - schedule
      - scheduled_for
      - slot
      - slot_display
      - snooze_count
      - snooze_until
      - status
      - status_display
    DoseEventStatusEnum:
      enum:
      - PENDING
      - TAKEN
      - MISSED
      - SNOOZED
      - SKIPPED
      type: string
      description: |-
        * `PENDING` - Due
        * `TAKEN` - Taken
        * `MISSED` - Missed
        * `SNOOZED` - Snoozed
        * `SKIPPED` - Skipped on purpose
    EmergencyContact:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        patient:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 150
        relationship:
          $ref: '#/components/schemas/CaregiverRelationshipEnum'
        relationship_display:
          type: string
          readOnly: true
        phone_number:
          type: string
          maxLength: 32
        email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        is_primary:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - patient
      - phone_number
      - relationship_display
    EmergencyContactRequest:
      type: object
      properties:
        patient:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 150
        relationship:
          $ref: '#/components/schemas/CaregiverRelationshipEnum'
        phone_number:
          type: string
          minLength: 1
          maxLength: 32
        email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        is_primary:
          type: boolean
      required:
      - name
      - patient
      - phone_number
    EnumOption:
      type: object
      description: One `{value, label}` pair in a dropdown.
      properties:
        value:
          type: string
        label:
          type: string
      required:
      - label
      - value
    Enums:
      type: object
      description: Every choice list the frontend renders, in one response.
      properties:
        roles:
          type: array
          items:
            $ref: '#/components/schemas/EnumOption'
        genders:
          type: array
          items:
            $ref: '#/components/schemas/EnumOption'
        blood_groups:
          type: array
          items:
            $ref: '#/components/schemas/EnumOption'
        medicine_categories:
          type: array
          items:
            $ref: '#/components/schemas/EnumOption'
        caregiver_relationships:
          type: array
          items:
            $ref: '#/components/schemas/EnumOption'
        assignment_statuses:
          type: array
          items:
            $ref: '#/components/schemas/EnumOption'
        condition_severities:
          type: array
          items:
            $ref: '#/components/schemas/EnumOption'
      required:
      - assignment_statuses
      - blood_groups
      - caregiver_relationships
      - condition_severities
      - genders
      - medicine_categories
      - roles
    FrequencyEnum:
      enum:
      - DAILY
      - SPECIFIC_DAYS
      - INTERVAL
      type: string
      description: |-
        * `DAILY` - Every day
        * `SPECIFIC_DAYS` - On chosen days
        * `INTERVAL` - Every N days
    GenderEnum:
      enum:
      - FEMALE
      - MALE
      - OTHER
      - UNDISCLOSED
      type: string
      description: |-
        * `FEMALE` - Female
        * `MALE` - Male
        * `OTHER` - Other
        * `UNDISCLOSED` - Prefer not to say
    GoogleAuthRequest:
      type: object
      description: Exchange a Google ID token for PillSync tokens.
      properties:
        id_token:
          type: string
          writeOnly: true
          minLength: 1
        role:
          allOf:
          - $ref: '#/components/schemas/SignupRoleEnum'
          default: PATIENT
          description: |-
            Only used when this is the first sign-in and the account is created.

            * `PATIENT` - Patient
            * `CAREGIVER` - Caregiver
      required:
      - id_token
    Health:
      type: object
      properties:
        status:
          type: string
        service:
          type: string
        version:
          type: string
      required:
      - service
      - status
      - version
    LogoutRequest:
      type: object
      description: The refresh token to blacklist.
      properties:
        refresh:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - refresh
    MedicalCondition:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
          maxLength: 64
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          maxLength: 200
        category:
          allOf:
          - $ref: '#/components/schemas/MedicineCategoryEnum'
          description: |-
            Medicine category most often prescribed for this condition.

            * `BLOOD_PRESSURE` - Blood Pressure
            * `DIABETES` - Diabetes
            * `THYROID` - Thyroid
            * `ANTIBIOTICS` - Antibiotics
            * `VITAMINS` - Vitamins
            * `HEART` - Heart Medications
            * `OTHER` - Other
        category_display:
          type: string
          readOnly: true
        is_chronic:
          type: boolean
          description: Chronic conditions drive long-term adherence tracking and refill
            prediction.
      required:
      - category_display
      - code
      - id
      - name
    MedicationSchedule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        medicine:
          type: string
          format: uuid
        slot:
          allOf:
          - $ref: '#/components/schemas/SlotEnum'
          default: MORNING
          description: |-
            The part of the day this dose belongs to, as the specification groups them.

            * `MORNING` - Morning
            * `AFTERNOON` - Afternoon
            * `EVENING` - Evening
            * `NIGHT` - Night
        slot_display:
          type: string
          readOnly: true
        time_of_day:
          type: string
          format: time
          description: Local time in the patient's timezone, not the server's.
        quantity_per_dose:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        frequency:
          $ref: '#/components/schemas/FrequencyEnum'
        frequency_display:
          type: string
          readOnly: true
        days_of_week:
          description: 'For SPECIFIC_DAYS: ISO weekday numbers, Monday=1 … Sunday=7.'
        interval_days:
          type: integer
          maximum: 365
          minimum: 1
          description: 'For INTERVAL: take every N days, counted from start_date.'
        start_date:
          type: string
          format: date
        end_date:
          type: string
