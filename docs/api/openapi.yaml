          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          nullable: true
          description: Pack size, so a refill can restore stock in one action.
        low_stock_threshold:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          description: Warn at or below this many units remaining.
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
          nullable: true
          description: Last day of the course. Empty for an ongoing medicine.
        is_active:
          type: boolean
        notes:
