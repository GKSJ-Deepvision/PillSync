      - created_at
      - emergency_contacts
      - full_name
      - gender_display
      - id
      - managed_by
      - managed_by_name
      - patient_conditions
      - updated_at
      - user
    PatientProfileCreateRequest:
      type: object
      description: |-
        Add a family member's profile.

        `managed_by` is taken from the request rather than the payload - letting a
        client name the manager would let anyone attach a profile to someone else's
        account.
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 150
        relationship_to_manager:
          description: |-
            How the managing account relates to this patient. Empty for a self profile.

            * `FAMILY` - Family member
            * `SPOUSE` - Spouse
            * `PARENT` - Parent
            * `CHILD` - Child
            * `PROFESSIONAL` - Professional caregiver
            * `NURSE` - Nurse
            * `DOCTOR` - Doctor
            * `OTHER` - Other
          oneOf:
          - $ref: '#/components/schemas/CaregiverRelationshipEnum'
          - $ref: '#/components/schemas/BlankEnum'
        date_of_birth:
          type: string
          format: date
          nullable: true
        gender:
          $ref: '#/components/schemas/GenderEnum'
        blood_group:
          $ref: '#/components/schemas/BloodGroupEnum'
        height_cm:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        weight_kg:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          nullable: true
        allergies:
          type: string
          description: Known drug and food allergies, one per line.
        notes:
          type: string
        timezone_name:
          type: string
          minLength: 1
          description: Reminders fire in the patient's own timezone, not the server's.
          maxLength: 64
        preferred_reminder_channel:
          $ref: '#/components/schemas/PreferredReminderChannelEnum'
        is_self:
          type: boolean
          description: True when the managing user is the patient.
        is_active:
          type: boolean
      required:
      - full_name
    PatientProfileRequest:
      type: object
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 150
        relationship_to_manager:
          description: |-
            How the managing account relates to this patient. Empty for a self profile.

            * `FAMILY` - Family member
            * `SPOUSE` - Spouse
            * `PARENT` - Parent
            * `CHILD` - Child
            * `PROFESSIONAL` - Professional caregiver
            * `NURSE` - Nurse
            * `DOCTOR` - Doctor
            * `OTHER` - Other
          oneOf:
          - $ref: '#/components/schemas/CaregiverRelationshipEnum'
          - $ref: '#/components/schemas/BlankEnum'
        date_of_birth:
          type: string
          format: date
          nullable: true
        gender:
          $ref: '#/components/schemas/GenderEnum'
        blood_group:
          $ref: '#/components/schemas/BloodGroupEnum'
        height_cm:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        weight_kg:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          nullable: true
        allergies:
          type: string
          description: Known drug and food allergies, one per line.
        notes:
          type: string
        timezone_name:
          type: string
          minLength: 1
          description: Reminders fire in the patient's own timezone, not the server's.
          maxLength: 64
        preferred_reminder_channel:
          $ref: '#/components/schemas/PreferredReminderChannelEnum'
        is_active:
          type: boolean
      required:
      - full_name
    PillSyncTokenObtainPairRequest:
      type: object
      description: |-
        Login. Adds the role to the token and the user object to the response.

        Without this the frontend would have to make a second request just to find
        out who logged in and what they are allowed to see.
      properties:
        email:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    PreferredReminderChannelEnum:
      enum:
      - PUSH
      - EMAIL
      - SMS
      type: string
      description: |-
        * `PUSH` - Push
        * `EMAIL` - Email
        * `SMS` - SMS
    Register:
      type: object
      description: |-
        Create an account.

        A patient registration also creates the patient's own profile, so a new user
        lands on a usable app rather than an empty one.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        full_name:
          type: string
          maxLength: 150
        phone_number:
          type: string
          maxLength: 32
        role:
          allOf:
          - $ref: '#/components/schemas/SignupRoleEnum'
          default: PATIENT
          description: |-
            Admin accounts are created by an administrator, never by self-registration.

            * `PATIENT` - Patient
            * `CAREGIVER` - Caregiver
      required:
      - email
      - full_name
      - id
    RegisterRequest:
      type: object
      description: |-
        Create an account.

        A patient registration also creates the patient's own profile, so a new user
        lands on a usable app rather than an empty one.
      properties:
        email:
          type: string
          format: email
          minLength: 1
          title: Email address
          maxLength: 254
        full_name:
          type: string
          minLength: 1
          maxLength: 150
        phone_number:
          type: string
          maxLength: 32
        role:
          allOf:
          - $ref: '#/components/schemas/SignupRoleEnum'
          default: PATIENT
          description: |-
            Admin accounts are created by an administrator, never by self-registration.

            * `PATIENT` - Patient
            * `CAREGIVER` - Caregiver
        password:
          type: string
          writeOnly: true
          minLength: 10
        password_confirm:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - full_name
      - password
      - password_confirm
    SeverityEnum:
      enum:
      - MILD
      - MODERATE
      - SEVERE
      - UNKNOWN
      type: string
      description: |-
        * `MILD` - Mild
        * `MODERATE` - Moderate
        * `SEVERE` - Severe
        * `UNKNOWN` - Not assessed
    SignupRoleEnum:
      enum:
      - PATIENT
      - CAREGIVER
      type: string
      description: |-
        * `PATIENT` - Patient
        * `CAREGIVER` - Caregiver
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    TokenVerifyRequest:
      type: object
      properties:
        token:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - token
    User:
      type: object
      description: The authenticated user as the frontend sees them.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
        full_name:
          type: string
          maxLength: 150
        phone_number:
          type: string
          maxLength: 32
        role:
          allOf:
          - $ref: '#/components/schemas/UserRoleEnum'
          readOnly: true
        role_display:
          type: string
          readOnly: true
        auth_provider:
          allOf:
          - $ref: '#/components/schemas/AuthProviderEnum'
          readOnly: true
        is_email_verified:
          type: boolean
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
          description: 'Deactivate instead of deleting: medication history must survive.'
        date_joined:
          type: string
          format: date-time
          readOnly: true
      required:
      - auth_provider
      - date_joined
      - email
      - full_name
      - id
      - is_active
      - is_email_verified
      - role
      - role_display
    UserRequest:
      type: object
      description: The authenticated user as the frontend sees them.
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 150
        phone_number:
          type: string
          maxLength: 32
      required:
      - full_name
    UserRoleEnum:
      enum:
      - PATIENT
      - CAREGIVER
      - ADMIN
      type: string
      description: |-
        * `PATIENT` - Patient
        * `CAREGIVER` - Caregiver
        * `ADMIN` - Admin
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
- name: auth
  description: Registration, login, tokens and passwords
- name: users
  description: The authenticated user and admin user management
- name: caregiving
  description: Caregiver to patient assignments
- name: profiles
  description: Patient profiles, conditions and emergency contacts
- name: reference
  description: Medicine catalogue and condition reference data
