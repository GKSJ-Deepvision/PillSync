  /api/v1/auth/google/:
    post:
      operationId: auth_google_create
      description: Exchange a verified Google ID token for PillSync tokens.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: Tokens and the signed-in user
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: Email and password login. Returns an access/refresh pair plus the
        user.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PillSyncTokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PillSyncTokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PillSyncTokenObtainPairRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: |-
        Blacklist a refresh token so it cannot be used again.

        The access token stays valid until it expires - that is how stateless JWTs
        work. Keeping the access lifetime short (30 minutes by default) is what
        bounds the window.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '205':
          description: No response body
