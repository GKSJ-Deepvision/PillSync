          allOf:
          - $ref: '#/components/schemas/MedicineCategoryEnum'
          description: |-
            Disease-based grouping, from the reference entry when there is one.

            * `BLOOD_PRESSURE` - Blood Pressure
            * `DIABETES` - Diabetes
            * `THYROID` - Thyroid
            * `ANTIBIOTICS` - Antibiotics
            * `VITAMINS` - Vitamins
            * `HEART` - Heart Medications
            * `OTHER` - Other
        instructions:
          type: string
          description: How to take it, e.g. 'after food'. Shown on every reminder.
          maxLength: 255
        quantity_remaining:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          description: Units left in the patient's possession. Decremented when a
            dose is taken.
