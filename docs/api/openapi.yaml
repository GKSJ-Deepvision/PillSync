components:
  schemas:
    AdminUser:
      type: object
      description: Full user record, for administrators only.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        full_name:
          type: string
          maxLength: 150
        phone_number:
          type: string
          maxLength: 32
        role:
          $ref: '#/components/schemas/UserRoleEnum'
        auth_provider:
          allOf:
          - $ref: '#/components/schemas/AuthProviderEnum'
          readOnly: true
        is_email_verified:
          type: boolean
        is_active:
          type: boolean
          description: 'Deactivate instead of deleting: medication history must survive.'
        is_staff:
          type: boolean
        date_joined:
          type: string
          format: date-time
          readOnly: true
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - auth_provider
      - created_at
      - date_joined
      - email
      - full_name
      - id
      - last_login
    AssignmentStatusEnum:
      enum:
      - PENDING
      - ACTIVE
      - REVOKED
      - DECLINED
      type: string
      description: |-
        * `PENDING` - Pending patient approval
        * `ACTIVE` - Active
        * `REVOKED` - Revoked
        * `DECLINED` - Declined
    AuthProviderEnum:
      enum:
      - LOCAL
      - GOOGLE
      type: string
      description: |-
        * `LOCAL` - Email and password
        * `GOOGLE` - Google
    BlankEnum:
      enum:
      - ''
    BloodGroupEnum:
      enum:
      - A+
      - A-
      - B+
      - B-
      - AB+
      - AB-
      - O+
      - O-
      - UNKNOWN
      type: string
      description: |-
        * `A+` - A+
        * `A-` - A-
        * `B+` - B+
        * `B-` - B-
        * `AB+` - AB+
        * `AB-` - AB-
        * `O+` - O+
        * `O-` - O-
        * `UNKNOWN` - Unknown
    CaregiverAssignment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        caregiver:
          type: string
          format: uuid
        caregiver_name:
          type: string
          readOnly: true
        caregiver_email:
          type: string
          format: email
          readOnly: true
        patient:
          type: string
          format: uuid
        patient_name:
          type: string
          readOnly: true
        patient_email:
          type: string
          format: email
          readOnly: true
        relationship:
          $ref: '#/components/schemas/CaregiverRelationshipEnum'
        status:
          allOf:
          - $ref: '#/components/schemas/AssignmentStatusEnum'
          readOnly: true
        can_view_adherence:
          type: boolean
        can_receive_alerts:
          type: boolean
        can_manage_medications:
          type: boolean
          description: 'Off by default: viewing a medication schedule and changing
            it are very different levels of trust.'
        responded_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        notes:
          type: string
          maxLength: 255
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - caregiver
      - caregiver_email
      - caregiver_name
      - created_at
      - id
      - patient
      - patient_email
      - patient_name
      - responded_at
      - status
    CaregiverInvite:
      type: object
      description: |-
        A patient invites a caregiver by email.

        Addressing the caregiver by email rather than id means the patient does not
        need to look up an internal identifier, and cannot enumerate accounts by
        trying ids.
      properties:
        caregiver_email:
          type: string
          format: email
        relationship:
          allOf:
          - $ref: '#/components/schemas/CaregiverRelationshipEnum'
          default: FAMILY
        can_view_adherence:
          type: boolean
          default: true
        can_receive_alerts:
          type: boolean
          default: true
        can_manage_medications:
          type: boolean
          default: false
        notes:
          type: string
          maxLength: 255
      required:
      - caregiver_email
    CaregiverInviteRequest:
      type: object
      description: |-
        A patient invites a caregiver by email.

        Addressing the caregiver by email rather than id means the patient does not
        need to look up an internal identifier, and cannot enumerate accounts by
        trying ids.
      properties:
        caregiver_email:
          type: string
          format: email
          minLength: 1
        relationship:
          allOf:
          - $ref: '#/components/schemas/CaregiverRelationshipEnum'
          default: FAMILY
        can_view_adherence:
          type: boolean
          default: true
        can_receive_alerts:
          type: boolean
          default: true
        can_manage_medications:
          type: boolean
          default: false
        notes:
          type: string
          maxLength: 255
      required:
      - caregiver_email
    CaregiverProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user:
          type: string
          format: uuid
          readOnly: true
        full_name:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        organisation:
          type: string
          maxLength: 200
        qualification:
          type: string
          maxLength: 200
        license_number:
          type: string
          maxLength: 64
        years_of_experience:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        is_professional:
          type: boolean
