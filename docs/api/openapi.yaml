openapi: 3.0.3
info:
  title: PillSync API
  version: 0.1.0
  description: Intelligent medicine reminder and medication tracking platform. Milestone
    1 covers authentication, role-based access and patient profiles.
paths:
  /api/v1/admin/users/:
    get:
      operationId: admin_users_list
      description: |-
        Administrator user management.

        Built from explicit mixins rather than ModelViewSet so that POST reaches the
        activate/deactivate actions only - there is no create route here, because a
        user is created through registration, and no destroy route, because
        medication history must outlive the account.
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: is_email_verified
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: role
        schema:
          type: string
          enum:
          - ADMIN
          - CAREGIVER
          - PATIENT
        description: |-
          * `PATIENT` - Patient
          * `CAREGIVER` - Caregiver
          * `ADMIN` - Admin
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - users
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminUserList'
          description: ''
  /api/v1/admin/users/{id}/:
    get:
      operationId: admin_users_retrieve
      description: |-
        Administrator user management.

        Built from explicit mixins rather than ModelViewSet so that POST reaches the
        activate/deactivate actions only - there is no create route here, because a
        user is created through registration, and no destroy route, because
        medication history must outlive the account.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this user.
        required: true
      tags:
      - users
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
    patch:
      operationId: admin_users_partial_update
      description: |-
        Administrator user management.

        Built from explicit mixins rather than ModelViewSet so that POST reaches the
        activate/deactivate actions only - there is no create route here, because a
        user is created through registration, and no destroy route, because
        medication history must outlive the account.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this user.
        required: true
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
  /api/v1/admin/users/{id}/activate/:
    post:
